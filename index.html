<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luxora Hotel</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:Poppins;
  background:linear-gradient(120deg,#1a2a6c,#b21f1f,#fdbb2d);
  color:white;
  overflow-x:hidden;
}

/* NAV */
nav{
  position:fixed;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:15px 30px;
  backdrop-filter:blur(15px);
  background:rgba(255,255,255,0.08);
  z-index:1000;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:url("https://images.unsplash.com/photo-1566073771259-6a8506099945") center/cover;
}
.hero h1{
  font-size:60px;
  font-family:Playfair Display;
}

/* BUTTON */
.btn{
  margin-top:20px;
  padding:12px 30px;
  border-radius:30px;
  border:none;
  background:linear-gradient(45deg,#ff9966,#ff5e62);
  cursor:pointer;
  transition:0.3s;
}
.btn:hover{
  transform:scale(1.1);
  box-shadow:0 0 25px rgba(255,255,255,0.6);
}

/* SECTIONS */
section{padding:80px 10%;}

/* CARDS */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}
.card{
  padding:20px;
  border-radius:20px;
  backdrop-filter:blur(10px);
  background:rgba(255,255,255,0.1);
  transition:0.4s;
}
.card:hover{
  transform:rotateY(10deg) scale(1.05);
}

/* 3D */
iframe{
  width:100%;
  height:400px;
  border:none;
  border-radius:20px;
}

/* BOOKING */
.booking{
  padding:30px;
  border-radius:20px;
  backdrop-filter:blur(15px);
  background:rgba(255,255,255,0.1);
}
input,select{
  width:100%;
  padding:10px;
  margin:10px 0;
  border-radius:10px;
  border:none;
}

/* CHATBOT */
.chatbot{
  position:fixed;
  bottom:20px;
  right:20px;
  width:300px;
  background:rgba(0,0,0,0.8);
  border-radius:15px;
  display:none;
  flex-direction:column;
}
.chat-header{
  padding:10px;
  background:#ff5e62;
}
.chat-body{
  height:200px;
  overflow-y:auto;
  padding:10px;
}
.chat-input{
  display:flex;
}
.chat-input input{
  flex:1;
  padding:8px;
  border:none;
}
.chat-input button{
  background:#ff5e62;
  border:none;
  color:white;
  padding:8px;
}

/* CHAT BUTTON */
.chat-btn{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#ff5e62;
  padding:12px;
  border-radius:50%;
  cursor:pointer;
}
</style>
</head>

<body>

<nav>
  <h2>Luxora</h2>
  <div>Luxury Experience</div>
</nav>

<section class="hero">
  <div>
    <h1 id="title">Next-Level Luxury</h1>
    <button class="btn">Book Now</button>
  </div>
</section>

<section>
  <h2>3D Experience</h2>
  <iframe src="https://my.spline.design/your-scene"></iframe>
</section>

<section>
  <h2>Rooms</h2>
  <div class="cards">
    <div class="card">Deluxe Suite</div>
    <div class="card">Royal Suite</div>
    <div class="card">Presidential Suite</div>
  </div>
</section>

<section>
  <h2>Book Now</h2>
  <div class="booking">
    <input id="checkin" type="date">
    <input id="checkout" type="date">
    <select id="guests">
      <option>1 Guest</option>
      <option>2 Guests</option>
    </select>
    <button class="btn" onclick="sendBooking()">Confirm Booking</button>
  </div>
</section>

<!-- CHAT -->
<div class="chat-btn" onclick="toggleChat()">💬</div>

<div class="chatbot" id="chatbot">
  <div class="chat-header">Luxury Assistant</div>
  <div class="chat-body" id="chatBody"></div>
  <div class="chat-input">
    <input id="chatInput" placeholder="Ask something...">
    <button onclick="sendChat()">Send</button>
  </div>
</div>

<script>
gsap.registerPlugin(ScrollTrigger);

// ANIMATIONS
gsap.from("#title",{y:80,opacity:0,duration:1.5});
gsap.from(".card",{scrollTrigger:".card",y:100,opacity:0,stagger:0.2});

// EMAILJS INIT
(function(){
  emailjs.init("YOUR_PUBLIC_KEY"); // replace
})();

function sendBooking(){
  emailjs.send("YOUR_SERVICE_ID","YOUR_TEMPLATE_ID",{
    checkin:document.getElementById("checkin").value,
    checkout:document.getElementById("checkout").value,
    guests:document.getElementById("guests").value
  }).then(()=>{
    alert("Booking Sent Successfully!");
  });
}

// CHATBOT
function toggleChat(){
  const bot=document.getElementById("chatbot");
  bot.style.display = bot.style.display==="flex" ? "none":"flex";
}

function sendChat(){
  const input=document.getElementById("chatInput");
  const body=document.getElementById("chatBody");

  let userMsg=input.value;
  body.innerHTML += "<p><b>You:</b> "+userMsg+"</p>";

  let reply="Our luxury rooms start at ₹20,000. How can I assist you?";
  if(userMsg.includes("price")) reply="Rooms start at ₹20,000/night.";
  if(userMsg.includes("booking")) reply="Use the booking form above.";

  body.innerHTML += "<p><b>Bot:</b> "+reply+"</p>";
  input.value="";
}
</script>

</body>
</html>
